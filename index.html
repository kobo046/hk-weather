<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cdeefd">
<title>香港天氣・抬頭望下天</title>
<style>
:root{color-scheme:light;--ink:#202b36;--blue:#cdeefd;--paper:#fffdf5;--yellow:#ffe48b;--edge:3px solid var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.7}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#ffffff80 1.5px,transparent 2px) 0 0/24px 24px;z-index:-1}main{max-width:740px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}header{position:relative;padding:6px 0 24px}.eyebrow{font-size:14px;font-weight:800;letter-spacing:2px}h1{font-size:clamp(32px,8vw,46px);line-height:1.25;margin:10px 0}header p{margin:0}h2{font-size:23px;margin:0 0 14px}h3{font-size:20px;margin:0}.card{border:var(--edge);border-radius:25px;background:var(--paper);box-shadow:5px 6px 0 var(--ink);padding:22px;margin-bottom:26px}.current{background:#fff1af;position:relative;overflow:hidden}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:14px;font-weight:800;border:2px solid var(--ink);border-radius:30px;padding:2px 12px;background:white}.big-icon{font-size:76px;line-height:1.3}.temperature{font-size:80px;font-weight:900;line-height:1.2;letter-spacing:-4px}.temperature small{font-size:32px;letter-spacing:0}.hero{display:flex;align-items:center;justify-content:space-between;margin:16px 0}.station{font-size:15px}label{display:block;font-weight:750;margin:16px 0 6px}select,button{font:inherit;color:var(--ink);border:var(--edge);border-radius:14px;min-height:48px}select{width:100%;padding:10px 38px 10px 12px;background:white}button{font-weight:800;background:var(--yellow);padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}button:hover{background:#ffdc6b}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}button:disabled{cursor:wait;opacity:.65}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #2775bc;outline-offset:4px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.metric{background:#ffffffb3;border:2px solid var(--ink);border-radius:16px;padding:12px}.metric span{display:block;font-size:14px}.metric strong{font-size:26px}.muted,.timestamp{font-size:14px;color:#4b5863}.timestamp{margin-top:14px}.section-text{white-space:pre-line;margin:10px 0}.warning{background:#ffe3d9}.warning-item{padding:12px 0;border-top:2px dashed #b4897b}.warning-item:first-child{border:0}.warning-item p{margin:4px 0;font-size:16px}.forecast-list{display:grid;gap:16px}.forecast{border:var(--edge);border-radius:19px;padding:17px;background:#fff}.forecast:nth-child(3n+2){background:#eef7e7}.forecast:nth-child(3n){background:#f4ecff}.forecast-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.forecast-icon{font-size:42px}.range{font-weight:850;font-size:25px;margin:6px 0}.rain{display:inline-block;font-size:15px;background:#e2f3ff;border-radius:10px;padding:3px 9px}.forecast p{font-size:17px;margin:10px 0 0}.error{border:var(--edge);border-radius:16px;background:#ffe3d9;padding:16px;margin-bottom:22px} [hidden]{display:none!important}.refresh-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 24px}.refresh-row p{margin:0;font-size:14px}footer{font-size:14px;text-align:center;margin-top:28px}a{color:inherit;text-underline-offset:4px}@media(prefers-reduced-motion:no-preference){.big-icon{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px) rotate(5deg)}}}@media(max-width:360px){.card{padding:16px}.temperature{font-size:68px}.big-icon{font-size:60px}.metrics{gap:8px}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">HONG KONG WEATHER</div><h1>抬頭望下天 ☁️</h1><p>香港天氣，一眼就睇晒。</p></header>
<div class="refresh-row"><p id="status" role="status" aria-live="polite">☁️ 正在接收天氣消息…</p><button id="refresh" type="button">↻ 重新整理</button></div>
<div id="error" class="error" role="alert" hidden></div>
<section class="card current" aria-labelledby="now-heading"><div class="topline"><h2 id="now-heading">而家嘅天氣</h2><span class="pill">香港 HKT</span></div><div class="hero"><div><div id="temp" class="temperature">—<small>°C</small></div><div id="station" class="station">香港天文台</div></div><span id="current-icon" class="big-icon" role="img" aria-label="天氣">🌤️</span></div><p id="hko-temp" class="station">天文台站：等待資料</p><label for="district">📍 揀個地區觀測站</label><select id="district" disabled><option>香港天文台</option></select><div class="metrics"><div class="metric"><span>💧 相對濕度 · 天文台</span><strong id="humidity">—</strong></div><div class="metric"><span>☀️ 紫外線指數 · 京士柏</span><strong id="uv">—</strong><span id="uv-desc">等待資料</span></div></div><div id="now-time" class="timestamp">更新時間：等待資料</div></section>
<section class="card" aria-labelledby="overview-heading"><h2 id="overview-heading">🌈 天氣概況</h2><h3 id="period">本港天氣預測</h3><p id="description" class="section-text">正在載入天氣預測…</p><p id="general" class="section-text"></p><p id="outlook" class="section-text"></p><div id="overview-time" class="timestamp"></div></section>
<section class="card warning" aria-labelledby="warning-heading"><h2 id="warning-heading">📣 生效中警告</h2><div id="warnings">正在查詢警告狀態…</div><div id="warning-time" class="timestamp"></div></section>
<section class="card" aria-labelledby="forecast-heading"><h2 id="forecast-heading">🗓️ 未來九日小預告</h2><p class="muted">降雨概率按天文台提供嘅級別顯示。</p><p id="forecast-general" class="section-text"></p><div id="forecasts" class="forecast-list">正在載入九天預報…</div><div id="forecast-time" class="timestamp"></div></section>
<footer>資料來源：<a href="https://www.hko.gov.hk/tc/" target="_blank" rel="noopener noreferrer">香港天文台</a> Open Data<br>時間均為香港時間（UTC+8）・出門記得望下天！</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php';
let temperatures=[],selected='香港天文台';
const time=value=>{const date=new Date(value);return value&&!Number.isNaN(date.getTime())?new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(date):'未提供';};
const put=(id,value)=>{$(id).textContent=value;};
function emoji(code){code=Number(code);if(code===50)return '☀️';if([51,52].includes(code))return '🌤️';if([53,54].includes(code))return '🌦️';if(code===60)return '☁️';if(code===61)return '🌧️';if([62,63,64,65].includes(code))return '⛈️';if([70,71,72,73,74,75,76,77].includes(code))return '🌙';if([80,81,82,83,84,85].includes(code))return '🌫️';if(code===90)return '🥵';if(code===91)return '🥶';if(code===92)return '💨';return '🌥️';}
function renderTemperature(){const item=temperatures.find(x=>x.place===selected);$('temp').replaceChildren(document.createTextNode(item?.value??'—'),Object.assign(document.createElement('small'),{textContent:'°C'}));put('station',selected);}
$('district').addEventListener('change',e=>{selected=e.target.value;renderTemperature();});
function renderCurrent(d){if(!Array.isArray(d.temperature?.data)||!d.temperature.data.length)throw Error('缺少氣溫資料');temperatures=d.temperature.data;const hko=temperatures.find(x=>x.place==='香港天文台');put('hko-temp',`天文台站：${hko?.value??'—'}°C`);if(!temperatures.some(x=>x.place===selected))selected=hko?.place??temperatures[0].place;$('district').replaceChildren(...temperatures.map(x=>new Option(x.place,x.place)));$('district').value=selected;$('district').disabled=false;renderTemperature();put('humidity',d.humidity?.data?.[0]?.value!=null?`${d.humidity.data[0].value}%`:'暫無資料');const uv=d.uvindex?.data?.[0];put('uv',uv?.value??'暫無資料');put('uv-desc',uv?`${uv.desc??''} · ${d.uvindex.recordDesc??''}`:'天文台暫未提供紫外線讀數');put('current-icon',emoji(d.icon?.[0]));put('now-time',`更新時間：${time(d.updateTime)}`);}
function renderOverview(d){if(typeof d.forecastDesc!=='string')throw Error('缺少天氣預測');put('period',d.forecastPeriod||'本港天氣預測');put('description',d.forecastDesc);put('general',d.generalSituation||'');put('outlook',d.outlook?`展望：${d.outlook}`:'');put('overview-time',`更新時間：${time(d.updateTime)}`);}
function renderWarnings(d){if(!d||Array.isArray(d)||typeof d!=='object')throw Error('警告資料格式不符');const active=Object.values(d).filter(w=>w&&w.actionCode!=='CANCEL'&&(!w.expireTime||new Date(w.expireTime).getTime()>Date.now()));const nodes=active.map(w=>{const node=document.createElement('article');node.className='warning-item';const title=document.createElement('h3');title.textContent=w.name||w.code||'天氣警告';const p=document.createElement('p');p.textContent=`發出：${time(w.issueTime)}${w.updateTime?' · 更新：'+time(w.updateTime):''}${w.expireTime?' · 有效至：'+time(w.expireTime):''}`;node.append(title,p);return node;});$('warnings').replaceChildren(...nodes);if(!nodes.length)put('warnings','🍀 目前冇生效中嘅天氣警告。');put('warning-time',`查詢時間：${time(new Date().toISOString())}`);}
function renderForecast(d){if(!Array.isArray(d.weatherForecast)||!d.weatherForecast.length)throw Error('缺少九天預報');put('forecast-general',d.generalSituation||'');$('forecasts').replaceChildren(...d.weatherForecast.slice(0,9).map(f=>{const card=document.createElement('article');card.className='forecast';const head=document.createElement('div');head.className='forecast-head';const title=document.createElement('h3');const date=String(f.forecastDate??'');title.textContent=`${Number(date.slice(4,6))}月${Number(date.slice(6,8))}日 · ${f.week??''}`;const icon=document.createElement('span');icon.className='forecast-icon';icon.textContent=emoji(f.ForecastIcon);icon.setAttribute('aria-hidden','true');head.append(title,icon);const range=document.createElement('div');range.className='range';range.textContent=`${f.forecastMintemp?.value??'—'}° – ${f.forecastMaxtemp?.value??'—'}°C`;const rain=document.createElement('span');rain.className='rain';rain.textContent=`💧 降雨概率：${f.PSR||'未提供'}`;const desc=document.createElement('p');desc.textContent=f.forecastWeather||'暫無天氣描述';card.append(head,range,rain,desc);return card;}));put('forecast-time',`更新時間：${time(d.updateTime)}`);}
const sections=[['rhrread','即時天氣',renderCurrent,'now-time'],['flw','天氣概況',renderOverview,'overview-time'],['fnd','九天預報',renderForecast,'forecast-time'],['warnsum','天氣警告',renderWarnings,'warning-time']];
async function request(type){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);try{const response=await fetch(`${API}?dataType=${type}&lang=tc`,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);return await response.json();}finally{clearTimeout(timer);}}
async function refresh(){if($('refresh').disabled)return;$('refresh').disabled=true;put('refresh','↻ 載入中');put('status','☁️ 正在接收天氣消息…');$('error').hidden=true;const results=await Promise.allSettled(sections.map(async([type,label,render,stamp])=>{try{render(await request(type));}catch(error){put(stamp,'⚠️ 更新失敗；如有舊資料，請留意原有時間。');if(type==='warnsum')put('warnings','暫時無法確認警告狀態，請到天文台查看最新消息。');if(type==='flw'&&$('description').textContent.includes('正在'))put('description','暫時收唔到天氣概況。');if(type==='fnd'&&$('forecasts').textContent.includes('正在'))put('forecasts','暫時收唔到九天預報。');throw new Error(label);}}));const failures=results.filter(r=>r.status==='rejected').map(r=>r.reason.message);if(failures.length){put('error',`☂️ 哎呀，${failures.join('、')}暫時收唔到。請檢查網絡，再撳「重新整理」試下。`);$('error').hidden=false;put('status',failures.length===4?'未能取得天氣資料':'部分資料未能更新');}else put('status',`✓ 已更新 · ${time(new Date().toISOString())}`);$('refresh').disabled=false;put('refresh','↻ 重新整理');}
$('refresh').addEventListener('click',refresh);refresh();
</script>
</body>
</html>
